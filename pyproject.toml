[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-color-facts"
version = "0.1.0"
description = "Evidence-based extraction of facts encoded by PDF table cell colours"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

